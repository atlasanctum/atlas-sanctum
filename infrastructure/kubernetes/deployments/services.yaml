  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────────────────
# FRONTEND (Dashboard + Marketplace + Governance)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-frontend
  namespace: atlas-production
  labels:
    app: atlas-frontend
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: atlas-frontend
  template:
    metadata:
      labels:
        app: atlas-frontend
    spec:
      containers:
        - name: atlas-frontend
          image: atlas-sanctum/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: api-url
            - name: VITE_SUPABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: supabase-url
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-supabase-secrets
                  key: anon-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-frontend
  namespace: atlas-production
spec:
  selector:
    app: atlas-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────────────────
# REDIS (caching, sessions, rate limiting)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-redis
  namespace: atlas-production
  labels:
    app: atlas-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-redis
  template:
    metadata:
      labels:
        app: atlas-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-redis-secrets
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: atlas-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-redis
  namespace: atlas-production
spec:
  selector:
    app: atlas-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-redis-pvc
  namespace: atlas-production
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
# ─────────────────────────────────────────────────────────────────────────────
# IPFS NODE
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-ipfs
  namespace: atlas-production
  labels:
    app: atlas-ipfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-ipfs
  template:
    metadata:
      labels:
        app: atlas-ipfs
    spec:
      containers:
        - name: ipfs
          image: ipfs/kubo:v0.27.0
          ports:
            - containerPort: 5001  # API
            - containerPort: 8080  # Gateway
            - containerPort: 4001  # Swarm
          env:
            - name: IPFS_PROFILE
              value: server
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: ipfs-data
              mountPath: /data/ipfs
      volumes:
        - name: ipfs-data
          persistentVolumeClaim:
            claimName: atlas-ipfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-ipfs
  namespace: atlas-production
spec:
  selector:
    app: atlas-ipfs
  ports:
    - name: api
      port: 5001
      targetPort: 5001
    - name: gateway
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-ipfs-pvc
  namespace: atlas-production
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi

---
# ─────────────────────────────────────────────────────────────────────────────
# INGRESS
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-ingress
  namespace: atlas-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - api.atlassanctum.com
        - app.atlassanctum.com
        - ipfs.atlassanctum.com
      secretName: atlas-tls
  rules:
    - host: api.atlassanctum.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port:
                  number: 4000
    - host: app.atlassanctum.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-frontend
                port:
                  number: 3000
    - host: ipfs.atlassanctum.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-ipfs
                port:
                  number: 8080

---
# ─────────────────────────────────────────────────────────────────────────────
# AGENT SERVICE (LangGraph — Python FastAPI)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-agent-service
  namespace: atlas-production
  labels:
    app: atlas-agent-service
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-agent-service
  template:
    metadata:
      labels:
        app: atlas-agent-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: atlas-agent-service
          image: atlas-sanctum/agent-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: AGENT_SERVICE_PORT
              value: "8001"
            - name: NODE_ENV
              value: production
            - name: AGENT_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-agent-secrets
                  key: agent-service-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-ai-secrets
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-ai-secrets
                  key: anthropic-api-key
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: atlas-neo4j-secrets
                  key: uri
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: atlas-neo4j-secrets
                  key: username
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-neo4j-secrets
                  key: password
            - name: WEAVIATE_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: weaviate-url
            - name: OPENAI_DEFAULT_MODEL
              value: gpt-4o
            - name: ANTHROPIC_DEFAULT_MODEL
              value: claude-3-5-sonnet-20241022
            - name: LLM_REQUEST_TIMEOUT_MS
              value: "30000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-agent-service
  namespace: atlas-production
spec:
  selector:
    app: atlas-agent-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-agent-service
  namespace: atlas-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-agent-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
