# Atlas Sanctum — Kubernetes Service Deployments
# Covers: ai, analytics, blockchain, identity, payments, frontend, marketplace, governance

---
# ─────────────────────────────────────────────────────────────────────────────
# AI SERVICE
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-ai
  namespace: atlas-production
  labels:
    app: atlas-ai
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-ai
  template:
    metadata:
      labels:
        app: atlas-ai
    spec:
      containers:
        - name: atlas-ai
          image: atlas-sanctum/ai-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-ai-secrets
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-ai-secrets
                  key: anthropic-api-key
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: atlas-neo4j-secrets
                  key: uri
            - name: WEAVIATE_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: weaviate-url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-ai
  namespace: atlas-production
spec:
  selector:
    app: atlas-ai
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────────────────
# ANALYTICS SERVICE
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-analytics
  namespace: atlas-production
  labels:
    app: atlas-analytics
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-analytics
  template:
    metadata:
      labels:
        app: atlas-analytics
    spec:
      containers:
        - name: atlas-analytics
          image: atlas-sanctum/analytics-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: atlas-neo4j-secrets
                  key: uri
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: atlas-neo4j-secrets
                  key: username
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-neo4j-secrets
                  key: password
            - name: CLICKHOUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: clickhouse-url
            - name: INFLUXDB_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: influxdb-url
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atlas-influxdb-secrets
                  key: token
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-analytics
  namespace: atlas-production
spec:
  selector:
    app: atlas-analytics
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP

---
