# BLOCKCHAIN SERVICE
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-blockchain
  namespace: atlas-production
  labels:
    app: atlas-blockchain
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-blockchain
  template:
    metadata:
      labels:
        app: atlas-blockchain
    spec:
      containers:
        - name: atlas-blockchain
          image: atlas-sanctum/blockchain-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: SANCTUM_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: sanctum-rpc-url
            - name: ETHEREUM_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-blockchain-secrets
                  key: ethereum-rpc-url
            - name: POLYGON_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-blockchain-secrets
                  key: polygon-rpc-url
            - name: IPFS_API_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: ipfs-api-url
            - name: PINATA_JWT
              valueFrom:
                secretKeyRef:
                  name: atlas-ipfs-secrets
                  key: pinata-jwt
            - name: BRIDGE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: bridge-api-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-blockchain
  namespace: atlas-production
spec:
  selector:
    app: atlas-blockchain
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────────────────
# IDENTITY SERVICE
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-identity
  namespace: atlas-production
  labels:
    app: atlas-identity
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-identity
  template:
    metadata:
      labels:
        app: atlas-identity
    spec:
      containers:
        - name: atlas-identity
          image: atlas-sanctum/identity-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-db-secrets
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-auth-secrets
                  key: jwt-secret
            - name: DID_RESOLVER_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: did-resolver-url
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-identity
  namespace: atlas-production
spec:
  selector:
    app: atlas-identity
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP

---
